name: Private APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/build.py'
      - 'tools/verify.py'
      - 'tools/ci.py'
      - 'ci-inputs.json'
      - '.github/workflows/apk.yml'
permissions:
  contents: read
concurrency:
  group: private-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Android tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          python -m pip install androguard==4.1.3
      - name: Restore private inputs
        env:
          WORKSHOP_INPUT_PASSWORD: ${{ secrets.WORKSHOP_INPUT_PASSWORD }}
        run: python tools/ci.py prepare
      - name: Build and sign APK
        run: python tools/build.py
      - name: Verify preserved code and resources
        run: python tools/verify.py
      - name: Prepare private APK download
        env:
          WORKSHOP_INPUT_PASSWORD: ${{ secrets.WORKSHOP_INPUT_PASSWORD }}
        run: python tools/ci.py finish
      - uses: actions/upload-artifact@v4
        with:
          name: wireless-workshop-${{ github.run_number }}
          path: .transfer/output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: evidence/
          retention-days: 3
          if-no-files-found: ignore
