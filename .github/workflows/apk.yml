name: Private APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'jadx/**'
      - 'native/**'
      - 'terminal/**'
      - 'debugger/**'
      - 'tools/build_debugger.py'
      - 'tools/build_terminal.py'
      - 'tools/build_jadx.py'
      - 'tools/build.py'
      - 'tools/verify.py'
      - 'tools/ci.py'
      - 'tools/MergeInputs.java'
      - 'ci-inputs.json'
      - '.github/workflows/apk.yml'
permissions:
  contents: read
concurrency:
  group: private-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android tools
        run: |
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          python -m pip install androguard==4.1.3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache/restore@v4
        id: jadx-cache
        with:
          path: .build/jadx-seed
          key: jadx-engine-${{ runner.os }}-${{ hashFiles('jadx/**', 'native/**', 'tools/build_jadx.py') }}
      - name: Restore private inputs
        env:
          WORKSHOP_INPUT_PASSWORD: ${{ secrets.WORKSHOP_INPUT_PASSWORD }}
        run: python tools/ci.py prepare
      - name: Build self-contained JADX engine
        run: python tools/build_jadx.py
      - uses: actions/cache/save@v4
        if: steps.jadx-cache.outputs.cache-hit != 'true'
        with:
          path: .build/jadx-seed
          key: ${{ steps.jadx-cache.outputs.cache-primary-key }}
      - name: Build embedded local shell
        run: python tools/build_terminal.py
      - name: Build embedded Java and native debugger
        run: python tools/build_debugger.py
      - name: Build and sign APK
        run: python tools/build.py
      - name: Verify preserved code and resources
        run: python tools/verify.py
      - name: Prepare private APK download
        env:
          WORKSHOP_INPUT_PASSWORD: ${{ secrets.WORKSHOP_INPUT_PASSWORD }}
        run: python tools/ci.py finish
      - uses: actions/upload-artifact@v4
        with:
          name: wireless-workshop-${{ github.run_number }}
          path: .transfer/output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: evidence/
          retention-days: 3
          if-no-files-found: ignore
