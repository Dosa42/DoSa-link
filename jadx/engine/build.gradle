plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ayrvokan.jadxengine'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ayrvokan.jadxengine'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.5.6'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
            merges += ['META-INF/services/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
configurations.configureEach {
    exclude group: 'ch.qos.logback'
    exclude group: 'io.github.skylot', module: 'jadx-java-convert'
}
dependencies {
    implementation 'io.github.skylot:jadx-core:1.5.6'
    implementation 'io.github.skylot:jadx-cli:1.5.6'
    implementation 'io.github.skylot:jadx-dex-input:1.5.6'
    implementation 'io.github.skylot:jadx-java-input:1.5.6'
    implementation 'io.github.skylot:jadx-smali-input:1.5.6'
    implementation 'io.github.skylot:jadx-kotlin-metadata:1.5.6'
    implementation 'com.github.tony19:logback-android:3.0.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
tasks.register('recordDependencies') {
    doLast {
        def entries = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(it.file.bytes).encodeHex().toString()
            [coordinate: it.moduleVersion.id.toString(), file: it.file.name, sha256: hash]
        }.sort { it.coordinate }
        def target = new File(rootProject.projectDir.parentFile, 'evidence/jadx-dependencies.json')
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n'
    }
}
